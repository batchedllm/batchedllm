name: Ruff and Ty and PyTest checks

on: [push, pull_request]

jobs:
  ruff_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - uses: astral-sh/setup-uv@v7

      - run: uv sync --locked --all-extras --dev

      - run: uv run ruff check >> $GITHUB_STEP_SUMMARY

  ty_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - uses: astral-sh/setup-uv@v7

      - run: uv sync --locked --all-extras --dev

      - run: uv run ty check >> $GITHUB_STEP_SUMMARY

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - uses: astral-sh/setup-uv@v7

      - run: uv sync --locked --all-extras --dev

      - run: uv run coverage run -m pytest >> $GITHUB_STEP_SUMMARY
      
      # - run: echo "\n\n\n" >> $GITHUB_STEP_SUMMARY
      
      - run: uv run coverage report -m  --format markdown >> $GITHUB_STEP_SUMMARY
