name: Ruff and Ty and PyTest checks

on: [push, pull_request]

jobs:
  ruff_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - uses: astral-sh/setup-uv@v7

      - run: uv sync --locked --all-extras --dev

      - run: uv run ruff check --output-format github >> $GITHUB_STEP_SUMMARY

  ty_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - uses: astral-sh/setup-uv@v7

      - run: uv sync --locked --all-extras --dev

      - run: uv run ty check --output-format github >> $GITHUB_STEP_SUMMARY

  pytest:
    name: pytest / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v7

      - run: uv sync --locked --all-extras --dev

      - run: uv run coverage run -m pytest >> $GITHUB_STEP_SUMMARY

      - run: echo "\n\n\n" >> $GITHUB_STEP_SUMMARY

      - run: uv run coverage report -m --format markdown >> $GITHUB_STEP_SUMMARY
